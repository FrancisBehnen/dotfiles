bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R 

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
# Other examples:
# set -g @plugin 'github_username/plugin_name'
# set -g @plugin 'github_username/plugin_name#branch'
# set -g @plugin 'git@github.com:user/plugin'
# set -g @plugin 'git@bitbucket.com:user/plugin'

# Settings
set -g @continuum-restore 'on'
set -g @resurrect-capture-pane-contents 'on'
# Restart Claude Code panes as `claude --continue` so they reconnect to that
# directory's most-recent conversation (full history) instead of a blank shell.
# tmux-resurrect can't snapshot live process memory, but Claude persists every
# conversation to disk, so --continue effectively restores the session.
set -g @resurrect-processes '"~claude->claude --continue"'
# NB: iTerm's tmux integration (-CC) hides the status line, so tmux-continuum's
# status-line-driven AUTO-SAVE never fires here. Saving is handled instead by a
# user LaunchAgent running scripts/tmux-resurrect-save every 5 min (see
# scripts/setup.sh). @continuum-restore above still repopulates "main" on start.
# Do NOT add @continuum-boot — iTerm already auto-reopens the `tmux -CC` window.

set -g allow-passthrough on
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'
set -g focus-events on
set -g mouse on

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
